<div class="min-h-screen bg-zinc-950 text-white">
  <div class="mx-auto max-w-6xl px-6 py-8">
    <header class="mb-10 flex items-start justify-between gap-4">
      <div>
        <p class="text-sm text-zinc-500">PeekPanel</p>
        <h1 class="mt-2 text-3xl font-bold">Welcome back, {{ userName() }} 👋</h1>
        <p class="mt-2 text-zinc-400">{{ userEmail() }}</p>
      </div>
      <button
        type="button"
        (click)="logout()"
        class="rounded-lg border border-zinc-700 px-4 py-2 text-sm font-medium text-zinc-300 transition hover:border-zinc-500 hover:text-white"
      >
        Logout
      </button>
    </header>
    <!-- Overview -->
    <section class="mb-10">
      <div class="mb-4">
        <h2 class="text-lg font-semibold">Overview</h2>
        <p class="mt-1 text-sm text-zinc-500">Your PeekPanel at a glance.</p>
      </div>
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <!-- Peeks -->
        <button
          type="button"
          (click)="goToPeeks()"
          class="group rounded-2xl border border-zinc-800 bg-zinc-900 p-6 text-left transition hover:border-zinc-600 hover:bg-zinc-900/80"
        >
          <div class="mb-4 text-2xl">📚</div>
          <div class="flex items-end justify-between">
            <div>
              <p class="text-sm text-zinc-400">My Peeks</p>
              <p class="mt-1 text-3xl font-bold">{{ peekCount() }}</p>
            </div>
            <span class="text-sm text-zinc-500 transition group-hover:text-white"> View → </span>
          </div>
        </button>
        <!-- Categories -->
        <button
          type="button"
          (click)="goToPeeks()"
          class="group rounded-2xl border border-zinc-800 bg-zinc-900 p-6 text-left transition hover:border-zinc-600 hover:bg-zinc-900/80"
        >
          <div class="mb-4 text-2xl">📁</div>
          <div class="flex items-end justify-between">
            <div>
              <p class="text-sm text-zinc-400">Categories</p>
              <p class="mt-1 text-3xl font-bold">{{ categoryCount() }}</p>
            </div>
            <span class="text-sm text-zinc-500 transition group-hover:text-white"> View → </span>
          </div>
        </button>
        <!-- Quick Access -->
        <button
          type="button"
          (click)="goToPeeks()"
          class="group rounded-2xl border border-zinc-800 bg-zinc-900 p-6 text-left transition hover:border-zinc-600 hover:bg-zinc-900/80"
        >
          <div class="mb-4 text-2xl">⚡</div>
          <div class="flex items-end justify-between">
            <div>
              <p class="text-sm text-zinc-400">Quick Access</p>
              <p class="mt-1 text-lg font-semibold">Open Peeks</p>
            </div>
            <span class="text-sm text-zinc-500 transition group-hover:text-white"> Open → </span>
          </div>
        </button>
      </div>
    </section>
    <!-- Recent Peeks -->
    <section>
      <div class="flex items-end justify-between">
        <div>
          <h2 class="text-lg font-semibold">Recent Peeks</h2>
          <p class="mt-1 text-sm text-zinc-500">Quickly access your saved knowledge.</p>
        </div>
        <button
          type="button"
          (click)="goToPeeks()"
          class="text-sm text-zinc-400 transition hover:text-white"
        >
          View all →
        </button>
      </div>
      <div class="mt-4 rounded-2xl border border-zinc-800 bg-zinc-900 p-6">
        <p class="text-sm text-zinc-500">Your recent peeks will appear here.</p>
      </div>
    </section>
  </div>
</div>
