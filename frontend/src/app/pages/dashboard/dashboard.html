<div class="min-h-screen bg-zinc-950 text-white">
  <div class="mx-auto max-w-6xl px-6 py-8">
    <header class="mb-10 flex items-start justify-between gap-4">
      <div>
        <p class="text-sm text-zinc-500">PeekPanel</p>

        <h1 class="mt-2 text-3xl font-bold">Welcome back, {{ userName() }} 👋</h1>

        <p class="mt-2 text-zinc-400">
          {{ userEmail() }}
        </p>
      </div>

      <button
        type="button"
        (click)="logout()"
        class="rounded-lg border border-zinc-700 px-4 py-2 text-sm font-medium text-zinc-300 transition hover:border-zinc-500 hover:text-white"
      >
        Logout
      </button>
    </header>

    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-6">
        <div class="mb-4 text-2xl">📚</div>

        <h2 class="text-lg font-semibold">My Peeks</h2>

        <p class="mt-2 text-sm text-zinc-400">
          Manage your notes, references, walkthroughs, and code snippets.
        </p>
      </div>

      <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-6">
        <div class="mb-4 text-2xl">🏷️</div>

        <h2 class="text-lg font-semibold">Categories</h2>

        <p class="mt-2 text-sm text-zinc-400">Organize your knowledge by category.</p>
      </div>

      <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-6">
        <div class="mb-4 text-2xl">⚡</div>

        <h2 class="text-lg font-semibold">Quick Access</h2>

        <p class="mt-2 text-sm text-zinc-400">Keep useful information ready when you need it.</p>
      </div>
    </div>
  </div>
</div>
