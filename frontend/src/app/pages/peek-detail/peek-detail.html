<div class="min-h-screen bg-zinc-950 text-white">
  <div class="mx-auto max-w-4xl px-6 py-8">
    <button
      type="button"
      (click)="goBack()"
      class="mb-8 text-sm text-zinc-400 transition hover:text-white"
    >
      ← Back to Peeks
    </button>

    @if (errorMessage()) {
      <div class="rounded-2xl border border-red-900 bg-red-950/40 p-6 text-red-300">
        {{ errorMessage() }}
      </div>
    }

    @if (showEditForm() && peek(); as currentPeek) {
      <div class="mb-8">
        <app-create-peek
          [editingPeek]="currentPeek"
          (peekCreated)="goBack()"
          (cancelled)="showEditForm.set(false)"
        />
      </div>
    }

    @if (peek(); as currentPeek) {
      <article class="rounded-2xl border border-zinc-800 bg-zinc-900 p-8">
        <div class="mb-6">
          <span class="inline-block rounded-full bg-zinc-800 px-3 py-1 text-xs text-zinc-400">
            {{ currentPeek.category_name }}
          </span>

          <h1 class="mt-4 text-3xl font-bold">
            {{ currentPeek.title }}
          </h1>

          <div class="mt-6 flex gap-2">
            <button
              type="button"
              (click)="editPeek()"
              class="rounded-lg border border-zinc-700 px-4 py-2 text-sm text-zinc-300 transition hover:border-zinc-500 hover:text-white"
            >
              Edit
            </button>

            <button
              type="button"
              (click)="deletePeek()"
              class="rounded-lg border border-red-900 px-4 py-2 text-sm text-red-400 transition hover:border-red-700 hover:text-red-300"
            >
              Delete
            </button>
          </div>

          <p class="mt-2 text-sm text-zinc-500">
            Updated {{ currentPeek.updated_at | date: 'medium' }}
          </p>
        </div>

        <div
          class="border-t border-zinc-800 pt-6 whitespace-pre-wrap text-sm leading-7 text-zinc-300"
        >
          {{ currentPeek.content }}
        </div>
      </article>
    }
  </div>
</div>
